<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voorskou</title>
<style>
  :root { --ink:#17303b; --sea:#1d5c73; --sand:#f3efe6; --line:#d6dde0; --wa:#128c4a; }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.5; color: var(--ink); background: #fff; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid #e0a100; outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: .02em; text-decoration: none; color: var(--sea); }
  .menu-btn { font: inherit; font-weight: 600; background: none; border: 1px solid var(--ink); border-radius: 4px; padding: 8px 14px; min-height: 44px; color: var(--ink); cursor: pointer; }
  nav { display: none; border-top: 1px solid var(--line); background: #fff; }
  nav.open { display: block; }
  nav a { display: block; padding: 14px 20px; text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); }

  /* Placeholder images: icon + small caption, deliberately empty */
  .slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 12px; background: #d3e3e9; color: #2c4f5e; font-size: 14px; }
  .slot svg { width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; opacity: .75; }
  .hero-slot { aspect-ratio: 4 / 3; background: #c2dbe4; }
  .hero-slot svg { width: 72px; height: 72px; }
  .unit .slot { aspect-ratio: 3 / 2; background: #e7dfcc; color: #433b27; }

  .hero { padding: 32px 0 38px; }
  h1 { font-size: 32px; line-height: 1.15; margin-bottom: 10px; }
  .sub { font-size: 19px; color: #3b5560; margin-bottom: 22px; }
  .btn-wa { display: flex; align-items: center; justify-content: center; background: var(--wa); color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; padding: 16px 20px; min-height: 56px; border-radius: 6px; }

  .units { background: var(--sand); padding: 32px 0 36px; }
  h2 { font-size: 22px; margin-bottom: 16px; }
  .unit { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .unit-body { padding: 14px 16px 16px; }
  .unit h3 { font-size: 20px; margin-bottom: 6px; }
  .unit .desc { color: #3b5560; margin-bottom: 10px; }
  .unit .meta { font-weight: 700; margin-bottom: 2px; }
  .unit .btn-wa { margin-top: 14px; font-size: 17px; }

  .find { padding: 32px 0; }
  .find p { font-size: 18px; }
  footer { background: var(--sea); color: #fff; padding: 24px 0 28px; font-size: 15px; }
  footer p + p { margin-top: 6px; }
  footer a { color: #fff; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" id="brand"></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu">Kieslys</button>
  </div>
  <nav id="menu" aria-label="Hoofkieslys">
    <a href="#eenhede" id="navUnits"></a>
    <a href="#vind-ons">Vind ons</a>
    <a href="#kontak">Navraag per WhatsApp</a>
  </nav>
</header>

<main id="top">
  <div class="slot hero-slot">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="3"/><circle cx="21" cy="24" r="5"/><path d="M6 48l16-14 11 9 8-7 17 14"/></svg>
    <span id="heroCaption"></span>
  </div>

  <section class="hero">
    <div class="wrap">
      <h1 id="heading"></h1>
      <p class="sub" id="subline"></p>
      <a class="btn-wa" id="kontak" target="_blank" rel="noopener">Navraag per WhatsApp</a>
    </div>
  </section>

  <section class="units" id="eenhede">
    <div class="wrap">
      <h2 id="unitsTitle"></h2>
      <div id="unitList"></div>
    </div>
  </section>

  <section class="find" id="vind-ons">
    <div class="wrap">
      <h2>Vind ons</h2>
      <p id="address"></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="credit"></p>
    <p><a id="footWa" target="_blank" rel="noopener"></a> · <a id="footMail"></a></p>
  </div>
</footer>

<script>
/* ============ EDIT ONLY THIS BLOCK FOR EACH NEW BUSINESS ============ */
var CONFIG = {
  name:         "Lafenis",
  heading:      "Selfsorg-akkommodasie in Lambertsbaai",
  subline:      "Twee eenhede, bespreek direk",
  address:      "Spence St, Lambert's Bay",
  unitWord:     "Eenheid",
  unitsTitle:   "Die eenhede",
  navUnits:     "Eenhede",
  units:        2,
  whatsapp:     "27738399334",
  whatsappShow: "073 839 9334",
  email:        "percipiodigital@gmail.com",
  credit:       "Voorskou gebou deur Percipio Digital"
};
/* ==================================================================== */

(function () {
  var C = CONFIG, $ = function (id) { return document.getElementById(id); };
  function wa(text) { return "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(text); }
  var icon = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="3"/><circle cx="21" cy="24" r="5"/><path d="M6 48l16-14 11 9 8-7 17 14"/></svg>';

  document.title = C.name + " – Voorskou";
  $("brand").textContent = C.name;
  $("navUnits").textContent = C.navUnits;
  $("heroCaption").textContent = "Foto van " + C.name + " kom hier";
  $("heading").textContent = C.heading;
  $("subline").textContent = C.subline;
  $("kontak").href = wa("Hallo, ek wil graag navraag doen oor beskikbaarheid by " + C.name + " vir ...");
  $("unitsTitle").textContent = C.unitsTitle;
  $("address").textContent = C.address;
  $("credit").textContent = C.credit;
  $("footWa").href = "https://wa.me/" + C.whatsapp;
  $("footWa").textContent = C.whatsappShow;
  $("footMail").href = "mailto:" + C.email;
  $("footMail").textContent = C.email;

  var html = "";
  for (var n = 1; n <= C.units; n++) {
    var label = C.unitWord + " " + n;
    var link = wa("Hallo, ek wil graag navraag doen oor " + label + " by " + C.name + ". Is dit beskikbaar van ... tot ...?");
    html += '<article class="unit"><div class="slot">' + icon + '<span>Foto van ' + label + ' kom hier</span></div>' +
      '<div class="unit-body"><h3>' + label + '</h3>' +
      '<p class="desc">Kort beskrywing van die eenheid kom hier</p>' +
      '<p class="meta">Slaap ?</p><p class="meta">Vanaf R ___</p>' +
      '<a class="btn-wa" href="' + link + '" target="_blank" rel="noopener">Vra oor ' + label + '</a></div></article>';
  }
  $("unitList").innerHTML = html;

  var btn = $("menuBtn"), menu = $("menu");
  function setMenu(open) {
    menu.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.textContent = open ? "Sluit" : "Kieslys";
  }
  btn.addEventListener("click", function () { setMenu(!menu.classList.contains("open")); });
  menu.addEventListener("click", function (e) { if (e.target.tagName === "A") setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });
})();
</script>
</body>
</html>
